<style>
:root{--bg:#F3F0FF;--card:#FFFFFF;--ink:#1A1446;--mute:#6A6590;--line:#DCD6F5;--acc:#5B3FD6;--hi:#FF6B3D;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:4px 0 18px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0 0 12px;font-weight:600}
h3{font-size:1rem;margin:0;font-weight:600}
.hi,.sub{color:var(--mute);margin:0}.sub{font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
section,.meter{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:18px;padding:18px}
.meter{margin-bottom:16px}.meter b{font-size:1.6rem;font-weight:800}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px;flex:1}
.fill{height:100%;background:var(--hi)}
ul{list-style:none;margin:0 0 12px;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.done .grow{text-decoration:line-through;color:var(--mute)}
input,button,textarea,select{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input[type=text]{flex:1 1 140px;width:auto}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:1.2rem;padding:4px 8px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--acc);background:none;cursor:pointer;flex:none;color:var(--on);font-weight:800;line-height:1}
.chk.on{background:var(--acc)}
.chip{border:1px solid var(--line);background:none;border-radius:14px;padding:2px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap;min-width:92px}
.s1{background:var(--hi);color:#1A1446;border-color:var(--hi)}
.s2{border-color:var(--acc);color:var(--acc);font-weight:600}
.s3{background:var(--acc);color:var(--on);border-color:var(--acc)}
.pick.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.week{display:flex;align-items:flex-end;gap:8px;height:90px;margin:12px 0 4px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem;color:var(--mute)}
.week span{display:block;width:100%;background:var(--hi);border-radius:4px 4px 0 0;min-height:2px}
.stack{display:grid;gap:16px}
.wide{grid-column:1/-1}
.note{background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.9rem}
.hero{border-top:0;border-left:8px solid var(--hi)}.quote{font-size:clamp(1.4rem,4.5vw,2.2rem);font-weight:800;line-height:1.2;margin:6px 0 0}details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}.dl p{margin:4px 0}
.refs{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:.85rem;color:var(--mute)}.refs b{color:var(--ink)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>

['apt','Aptitude (zero to advanced)',['Beginner: Percentages','Beginner: Ratio and proportion','Beginner: Averages','Beginner: Profit and loss','Intermediate: Time and work','Intermediate: Speed and distance','Intermediate: Permutation and combination','Intermediate: Probability','Intermediate: Number series','Advanced: Data interpretation','Advanced: Logical reasoning sets','Advanced: Seating arrangements','Advanced: Verbal ability and reading comprehension'],'Practise with a timer once the basics are done.'],

const EN=[
['Listen for 15 minutes (a slow story or simple English audio)','Learn 5 new words and say each in a sentence aloud','Say today\u2019s speaking prompt aloud 3 times','Write 3 simple sentences about your day','Repeat 10 common phrases aloud'],
['Listen for 20 minutes (podcast or talk with subtitles)','Learn 8 new words and use them in sentences','Record yourself speaking for 2 minutes on the prompt','Write 5 sentences and fix one mistake','Read one page aloud'],

const GUIDE=[
['Collect every internal mark','Each subject has 40 internal marks: 8 for attendance, 20 for the two class tests and 12 for assignments or quizzes. Never miss class or an assignment. This is the surest way to lead the rank list.'],
['Cover all five modules','The end-semester paper has 10 compulsory short questions (2 from every module) and, in Part B, a choice of one from two in every module. Skipping any module costs marks, so finish the whole syllabus.'],

let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.habits)S={tab:'today',sem:'S1',tasks:[],study:{},goal:240,prog:{},custom:{},pick:{},exams:[],lvl:1,eng:{},vocab:[],notes:{},story:{},

function applyTheme(){

const dayMins=d=>Object.values(S.study[d]||{}).reduce((a,b)=>a+b,0);

/* ---------- helpers ---------- */
function adder(ph,fn,label){
  const i=el('input',{type:'text',placeholder:ph,ariaLabel:ph});
  const go=()=>{const v=i.value.trim();if(v){fn(v);save();render()}};
  i.onkeydown=e=>{if(e.key==='Enter')go()};
  return el('div',{className:'row'},i,el('button',{className:'btn',textContent:label||'Add',onclick:go}));
}
const sec=(t,...k)=>el('section',{},el('h2',{},t),...k);
const chk=(on,fn,lbl)=>el('button',{className:'chk'+(on?' on':''),textContent:on?'\u2713':'',ariaLabel:lbl,onclick:fn});
const xbtn=(fn,lbl)=>el('button',{className:'x',textContent:'\u00d7',ariaLabel:lbl,onclick:fn});
const bar=(l,p)=>el('div',{className:'row',style:'margin:6px 0'},el('span',{style:'width:150px'},l),el('div',{className:'track',style:'margin:0'},el('div',{className:'fill',style:'width:'+p+'%'})),el('b',{},p+'%'));

  const fi=el('input',{type:'file',accept:'.json,application/json',ariaLabel:'Restore backup',onchange:e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.habits)throw 0;S=fix(o);save();render()}catch(x){msg.textContent='That file is not a valid backup.'}};r.readAsText(f)}});
  const msg=el('p',{className:'sub'});
  v.append(el('h1',{},'Settings'),el('div',{className:'stack'},
    sec('Light or dark mode',el('div',{className:'row'},mode('auto','Match my phone'),mode('light','Light'),mode('dark','Dark'))),
    sec('App theme',pal),
    sec('Backup and restore',el('p',{className:'sub',style:'margin-bottom:10px'},'Your data lives on this device. Download a backup now and then, and restore it on a new phone.'),el('div',{className:'row'},el('button',{className:'btn',textContent:'Download backup',onclick:exportData})),el('p',{className:'sub',style:'margin:12px 0 6px'},'Restore from a backup file:'),fi,msg)));
};

/* ---------- shell ---------- */
const TABS=[['today','Today'],['rise','Rise'],['syllabus','Syllabus'],['english','English'],['exams','Exams'],['prep','Prep'],['skills','Skills'],['records','Marks'],['diary','Diary'],['history','History'],['progress','Progress'],['profile','Profile'],['settings','Settings']];
function render(){
  applyTheme();
  $('#tabs').replaceChildren(...TABS.map(([k,l])=>el('button',{className:'tab',textContent:l,ariaSelected:S.tab===k,onclick:()=>{S.tab=k;save();render()}})));
  const v=$('#view');v.replaceChildren();V[S.tab](v);
}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
